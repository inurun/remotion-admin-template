[tools]
node = "24.15.0"
"npm:pnpm" = { version = "11.0.3", depends = "node" }

[env]
_.file = ".env"

[tasks."dev:template"]
run = "pnpm dev"

[tasks."dev:haqumei-api"]
dir = "../haqumei-api"
run = """
if curl -fsS --max-time 1 "${HAQUMEI_API_URL}/health/live" > /dev/null 2>&1; then
  echo "haqumei-api is already running at ${HAQUMEI_API_URL}, skipping start"
else
  mise exec -- cargo run -p haqumei-api
fi
"""

[tasks.dev]
depends = ["dev:template", "dev:haqumei-api"]
